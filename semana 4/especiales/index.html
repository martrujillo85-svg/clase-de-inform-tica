<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relación de Columnas - Teclas Especiales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Relaciona las Teclas Especiales</h1>
    <p>Haz clic en una tecla de la izquierda y luego en su función correspondiente a la derecha.</p>

    <div class="container">
        <div class="column" id="col-teclas">
            <!-- Las teclas se generarán aquí con JS -->
        </div>
        <div class="column" id="col-funciones">
            <!-- Las funciones se generarán aquí con JS -->
        </div>
    </div>

    <div id="mensaje">¡Felicidades! Has completado la actividad correctamente.</div>

    <script src="script.js"></script>
</body>
</html>
