<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Paisajes en Píxeles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pixel-app-container">
        <header>
            <h2>🎨 Creador de Paisajes Naturales</h2>
            <p>Selecciona un color o textura y pinta tu propio escenario en la cuadrícula.</p>
        </header>

        <div class="workspace">
            <!-- PANEL IZQUIERDO: Herramientas de Colores y Texturas en Cuadrados -->
            <div class="tools-panel">
                <h3>Paleta de Colores</h3>
                <div class="color-palette">
                    <!-- Tonos Rojo y Naranja -->
                    <button class="tool-box" style="background: #FB2C36;" onclick="selectTool('#FB2C36', 'color')" title="Rojo"></button>
                    <button class="tool-box" style="background: #FF692A;" onclick="selectTool('#FF692A', 'color')" title="Naranja Rojo"></button>
                    <button class="tool-box" style="background: #FE9A37;" onclick="selectTool('#FE9A37', 'color')" title="Naranja"></button>
                    <button class="tool-box" style="background: #ebb24a;" onclick="selectTool('#ebb24a', 'color')" title="Naranja Amarillo"></button>

                    <!-- Tonos Amarillo -->
                    <button class="tool-box" style="background: #FFFF00;" onclick="selectTool('#FFFF00', 'color')" title="Amarillo"></button>
                    <button class="tool-box" style="background: #ffd900be;" onclick="selectTool('#ffd900be', 'color')" title="Oro"></button>
                    <button class="tool-box" style="background: #994b14;" onclick="selectTool('#994b14', 'color')" title="Café"></button>
                    <button class="tool-box" style="background: #462605;" onclick="selectTool('#462605', 'color')" title="Chocolate"></button>
                    
                    
                    <!-- Tonos Vegetación -->
                    <button class="tool-box" style="background: #7CCF35;" onclick="selectTool('#7CCF35', 'color')" title="Verde Lima"></button>
                    <button class="tool-box" style="background: #0c3a15;" onclick="selectTool('#0c3a15', 'color')" title="Verde Follaje"></button>
                    <button class="tool-box" style="background: #02b82f;" onclick="selectTool('#02b82f', 'color')" title="Verde"></button>
                    <button class="tool-box" style="background: #07d3b4;" onclick="selectTool('#07d3b4', 'color')" title="Aqua"></button>

                    <!-- Tonos Cielo y Azul -->
                    <button class="tool-box" style="background: #89f3f7;" onclick="selectTool('#89f3f7', 'color')" title="Azul Claro"></button>
                    <button class="tool-box" style="background: #34A6F4;" onclick="selectTool('#34A6F4', 'color')" title="Azul Cielo"></button>
                    <button class="tool-box" style="background: #055cdd;" onclick="selectTool('#055cdd', 'color')" title="Azul "></button>
                    <button class="tool-box" style="background: #0f2e9c;" onclick="selectTool('#0f2e9c', 'color')" title="Azul Rey"></button>

                    <!-- Tonos Morados -->
                    <button class="tool-box" style="background: #615FFF;" onclick="selectTool('#615FFF', 'color')" title="Azul Violeta"></button>
                    <button class="tool-box" style="background: #8E51FF;" onclick="selectTool('#8E51FF', 'color')" title="Morado Lila"></button>
                    <button class="tool-box" style="background: #A684FF;" onclick="selectTool('#A684FF', 'color')" title="Lavanda"></button>
                    <button class="tool-box" style="background: #5D0EC0;" onclick="selectTool('#5D0EC0', 'color')" title="Morado Oscuro"></button>

                    <!-- Tonos Rosas -->
                    <button class="tool-box" style="background: #eb0981;" onclick="selectTool('#eb0981', 'color')" title="Rosa Fiucsa"></button>
                    <button class="tool-box" style="background: #bb6795;" onclick="selectTool('#bb6795', 'color')" title="Rosa "></button>
                    <button class="tool-box" style="background: #FCCEE8;" onclick="selectTool('#FCCEE8', 'color')" title="Rosa Claro"></button>
                    <button class="tool-box" style="background: #fc5fb5;" onclick="selectTool('#fc5fb5', 'color')" title="Rosa cHICLE"></button>
               
                    <!-- Tonos Carne-->
                    <button class="tool-box" style="background: #F8BD7F;" onclick="selectTool('#F8BD7F', 'color')" title="Durazno"></button>
                    <button class="tool-box" style="background: #E69A60;" onclick="selectTool('#E69A60', 'color')" title="Arcilla"></button>
                    <button class="tool-box" style="background: #C87948;" onclick="selectTool('#C87948', 'color')" title="Terracota"></button>
                    <button class="tool-box" style="background: #B36130;" onclick="selectTool('#B36130', 'color')" title="Caoba"></button>

                    <!-- Tonos Negros y gris-->
                    <button class="tool-box" style="background: #ffffff;" onclick="selectTool('#ffffff', 'color')" title="Blanco"></button>
                    <button class="tool-box" style="background: #9e9d9d;" onclick="selectTool('#9e9d9d', 'color')" title="Plata"></button>
                    <button class="tool-box" style="background: #494949;" onclick="selectTool('#494949', 'color')" title="Gris "></button>
                    <button class="tool-box" style="background: #000;" onclick="selectTool('#000', 'color')" title="Negro "></button>
                </div>

                <h3>Elementos y Texturas</h3>
                <div class="texture-palette">
                    <button class="texture-box" onclick="selectTool('☁️', 'texture')">☁️ <span>Nube</span></button>
                    <button class="texture-box" onclick="selectTool('🌳', 'texture')">🌳 <span>Árbol</span></button>
                    <button class="texture-box" onclick="selectTool('⛰️', 'texture')">⛰️ <span>Montaña</span></button>
                    <button class="texture-box" onclick="selectTool('💧', 'texture')">💧 <span>Agua</span></button>
                    <button class="texture-box" onclick="selectTool('🏠', 'texture')">🏠 <span>Casa</span></button>
                    <button class="texture-box" onclick="selectTool('🏰', 'texture')">🏰 <span>Castillo</span></button>
                    <button class="texture-box eraser" onclick="selectTool('', 'eraser')">🧹 <span>Borrador</span></button>
                </div>

                <button class="clear-btn" onclick="clearGrid()">🗑️ Limpiar Lienzo</button>
            </div>

            <!-- PANEL DERECHO: Cuadrícula Grande -->
            <div class="canvas-container">
                <div id="pixel-grid" class="pixel-grid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
